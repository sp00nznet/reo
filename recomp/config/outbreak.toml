# Individual instruction patches
instructions = [
  # NOTE: ElfAnalyzer auto-generated 42 entries here, each nop-ing a `sw` with
  # the comment "Potential self-modifying code". The heuristic is wrong for
  # this game -- every one of them is an ordinary data store, and nop-ing them
  # silently deleted real logic. Among the casualties:
  #   0x12B72C  sw $v0,0($s0)  -> [0x2104E8], main's tid as the render waiter
  #   0x12C418  sw $zero,...   -> [0x210458], the worker-dispatch gate
  #   0x12C030, 0x12C2D4       -> the rest of that handshake
  # With them nop-ed, main slept in the frame wait and no worker could ever
  # wake it, which looked for a long time like an unreachable initialiser.
  # Do not re-add without proving the target really is the code segment.
]


